<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>カクヤス武蔵小杉 ルート採点＆模範解答シミュレーター</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 12px; max-width: 600px; margin: 0 auto; }
    
    header { background: #1e293b; color: #fff; padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .depot-badge { font-size: 0.75rem; background: #3b82f6; color: #fff; padding: 3px 8px; border-radius: 999px; font-weight: bold; }

    /* 採点比較ボード */
    .score-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .score-card { background: #1e293b; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #334155; }
    .score-card.user { border-color: #3b82f6; }
    .score-card.optimal { border-color: #10b981; background: linear-gradient(180deg, #1e293b, #064e3b); }

    .score-title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; }
    .score-val { font-size: 2.2rem; font-weight: 900; line-height: 1.1; margin-bottom: 4px; }
    .score-val.user-val { color: #38bdf8; }
    .score-val.opt-val { color: #34d399; }
    
    .score-sub { font-size: 0.78rem; color: #cbd5e1; font-weight: 500; }

    /* 正解ルート案内枠 */
    .optimal-box { background: #064e3b; border: 1.5px dashed #10b981; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 0.82rem; }
    .optimal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .optimal-title { font-weight: bold; color: #a7f3d0; display: flex; align-items: center; gap: 4px; }
    .btn-apply-opt { background: #10b981; color: #022c22; border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-apply-opt:active { background: #059669; }
    .optimal-flow { color: #ecfdf5; line-height: 1.5; font-family: monospace; font-size: 0.8rem; word-break: break-all; }

    .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
    h2 { font-size: 0.88rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    
    .textarea-addr { width: 100%; background: #0f172a; color: #f8fafc; border: 1.5px solid #334155; border-radius: 8px; padding: 10px; font-size: 0.88rem; font-family: inherit; resize: vertical; min-height: 75px; margin-top: 4px; }
    .textarea-addr:focus { outline: none; border-color: #38bdf8; }

    .btn-add { width: 100%; background: #334155; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.88rem; cursor: pointer; margin-top: 6px; }
    
    .order-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .order-item.sortable-ghost { opacity: 0.2; background: #3b82f6; }
    
    .drag-handle { cursor: grab; padding: 6px 10px; color: #64748b; font-size: 1.3rem; user-select: none; }
    .order-num { width: 28px; height: 28px; border-radius: 50%; background: #2563eb; color: #fff; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 8px; }
    .order-info { flex: 1; overflow: hidden; }
    .order-name { font-size: 0.88rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f8fafc; }
    .order-zone { font-size: 0.72rem; display: inline-block; padding: 1px 6px; border-radius: 4px; margin-top: 2px; }

    .zone-north { background: #1e3a8a; color: #93c5fd; }
    .zone-south { background: #14532d; color: #86efac; }
    .zone-west { background: #7c2d12; color: #fdba74; }

    .btn-delete { background: none; border: none; color: #ef4444; font-size: 0.85rem; cursor: pointer; padding: 4px 6px; margin-left: 6px; }
    
    .btn-all-gmaps { display: block; text-align: center; background: #2563eb; color: #fff; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 12px rgba(37,99,235,0.3); margin-top: 14px; }
    .btn-all-gmaps:active { background: #1d4ed8; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-weight: bold; font-size: 0.95rem;">カクヤス武蔵小杉店</div>
      <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 2px;">新丸子東2丁目 発着採点</div>
    </div>
    <span class="depot-badge">答え合わせ機能付</span>
  </header>

  <!-- 採点比較ボード -->
  <div class="score-container" id="score-container" style="display: none;">
    <div class="score-card user">
      <div class="score-title">あなたの現在スコア</div>
      <div class="score-val user-val" id="user-score">-- 点</div>
      <div class="score-sub" id="user-time">予想: -- 分</div>
    </div>
    <div class="score-card optimal">
      <div class="score-title">理論上の満点（正解）</div>
      <div class="score-val opt-val">100 点</div>
      <div class="score-sub" id="opt-time">最速: -- 分</div>
    </div>
  </div>

  <!-- 正解ルート案内枠 -->
  <div class="optimal-box" id="optimal-box" style="display: none;">
    <div class="optimal-header">
      <span class="optimal-title">🎯 満点（正解）の巡回順序</span>
      <button class="btn-apply-opt" onclick="applyOptimalRoute()">💡 正解順に並び替える</button>
    </div>
    <div class="optimal-flow" id="optimal-flow-text">--</div>
  </div>

  <div class="card">
    <h2>
      <span>📝 配達先リスト入力</span>
      <span id="order-count" style="font-size: 0.75rem; color: #38bdf8;">0件</span>
    </h2>
    <textarea id="address-input" class="textarea-addr" placeholder="住所を複数行で貼り付け可能"></textarea>
    <button class="btn-add" onclick="addAddresses()">住所を追加する ＋</button>
  </div>

  <div class="card">
    <h2>
      <span>📍 巡回順 (☰を上下にドラッグして満点を狙う)</span>
      <button class="btn-delete" onclick="clearOrders()">全件削除</button>
    </h2>
    <div id="order-list">
      <div style="text-align: center; color: #64748b; font-size: 0.82rem; padding: 20px;">
        住所を入力してください。
      </div>
    </div>
  </div>

  <div id="gmaps-box" style="display: none; margin-bottom: 24px;">
    <a id="btn-gmaps" class="btn-all-gmaps" href="#" target="_blank">
      🗺️ 現在の順序でGoogleマップを起動
    </a>
  </div>

  <script>
    const DEPOT = {
      name: "カクヤス武蔵小杉店",
      lat: 35.577328,
      lng: 139.662047,
      zone: "BASE"
    };

    const AREA_ZONES = [
      { key: "上丸子", zone: "NORTH", label: "北東(丸子)", lat: 35.5845, lng: 139.6690 },
      { key: "丸子通", zone: "NORTH", label: "北東(丸子)", lat: 35.5825, lng: 139.6650 },
      { key: "新丸子", zone: "NORTH", label: "北東(丸子)", lat: 35.5790, lng: 139.6620 },
      { key: "小杉陣屋町", zone: "NORTH_WEST", label: "北西(陣屋町)", lat: 35.5865, lng: 139.6525 },
      { key: "小杉御殿町", zone: "NORTH_WEST", label: "北西(御殿町)", lat: 35.5825, lng: 139.6490 },
      { key: "小杉町", zone: "WEST", label: "西(小杉駅前)", lat: 35.5750, lng: 139.6560 },
      { key: "今井南町", zone: "WEST", label: "西(今井)", lat: 35.5700, lng: 139.6520 },
      { key: "木月", zone: "SOUTH_WEST", label: "南西(元住吉)", lat: 35.5630, lng: 139.6500 },
      { key: "西加瀬", zone: "SOUTH_WEST", label: "南西(西加瀬)", lat: 35.5615, lng: 139.6590 },
      { key: "苅宿", zone: "SOUTH_WEST", label: "南西(苅宿)", lat: 35.5605, lng: 139.6535 },
      { key: "中丸子", zone: "SOUTH_EAST", label: "南東(横須賀線側)", lat: 35.5685, lng: 139.6630 },
      { key: "下沼部", zone: "SOUTH_EAST", label: "南東(下沼部)", lat: 35.5680, lng: 139.6700 },
      { key: "市ノ坪", zone: "SOUTH_EAST", label: "南東(市ノ坪)", lat: 35.5665, lng: 139.6570 },
      { key: "平間", zone: "SOUTH_EAST", label: "南東(平間)", lat: 35.5600, lng: 139.6710 },
      { key: "田尻町", zone: "SOUTH_EAST", label: "南東(田尻町)", lat: 35.5585, lng: 139.6770 },
      { key: "北谷町", zone: "SOUTH_EAST", label: "南東(北谷町)", lat: 35.5620, lng: 139.6730 },
      { key: "山王町", zone: "EAST", label: "東(山王町)", lat: 35.5760, lng: 139.6700 }
    ];

    let orders = [];
    let bestOrderList = []; // 満点（正解）の並び順
    let sortableInstance = null;

    function addAddresses() {
      const text = document.getElementById('address-input').value;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return;

      for (const line of lines) {
        let matched = AREA_ZONES.find(a => line.includes(a.key));
        if (!matched) {
          matched = { zone: "OTHER", label: "中原区", lat: 35.5750, lng: 139.6600 };
        }

        orders.push({
          id: String(Date.now() + Math.random()),
          name: line,
          zone: matched.zone,
          label: matched.label,
          lat: matched.lat,
          lng: matched.lng
        });
      }

      document.getElementById('address-input').value = '';
      renderList();
    }

    // 巡回コスト（時間分）を計算する共通関数
    function evaluateRouteCost(routeList) {
      const points = [DEPOT, ...routeList, DEPOT];
      let totalKm = 0;
      let railwayCrossings = 0;
      let zoneShuffles = 0;

      for (let i = 0; i < points.length - 1; i++) {
        const from = points[i];
        const to = points[i + 1];

        const dLat = Math.abs(from.lat - to.lat) * 111;
        const dLng = Math.abs(from.lng - to.lng) * 91;
        totalKm += (dLat + dLng) * 1.25;

        const isFromNorth = from.zone.includes("NORTH") || from.zone === "BASE";
        const isToNorth = to.zone.includes("NORTH") || to.zone === "BASE";
        const isFromSouth = from.zone.includes("SOUTH");
        const isToSouth = to.zone.includes("SOUTH");

        if ((isFromNorth && isToSouth) || (isFromSouth && isToNorth)) {
          railwayCrossings++;
        }

        if (from.zone !== to.zone && from.zone !== "BASE" && to.zone !== "BASE") {
          zoneShuffles++;
        }
      }

      const drivingMin = (totalKm / 16) * 60;
      const deliveryMin = routeList.length * 3;
      const penaltyMin = railwayCrossings * 2.5 + (zoneShuffles > routeList.length * 0.7 ? 3 : 0);
      const totalMinutes = Math.round(drivingMin + deliveryMin + penaltyMin);

      return { totalMinutes, totalKm, railwayCrossings };
    }

    // 全巡回パターンを総当たりして「満点（正解）」を探索
    function findOptimalRoute(arr) {
      if (arr.length <= 1) return { route: arr, cost: evaluateRouteCost(arr) };

      function permute(elements) {
        if (elements.length <= 1) return [elements];
        let perms = [];
        for (let i = 0; i < elements.length; i++) {
          const el = elements[i];
          const rest = elements.slice(0, i).concat(elements.slice(i + 1));
          const sub = permute(rest);
          for (const s of sub) {
            perms.push([el, ...s]);
          }
        }
        return perms;
      }

      // 8件以下なら完全総当たり（例: 5件=120通り）
      const allPerms = (arr.length <= 8) ? permute(arr) : [arr];
      let best = null;
      let minCost = Infinity;

      for (const p of allPerms) {
        const cost = evaluateRouteCost(p);
        if (cost.totalMinutes < minCost) {
          minCost = cost.totalMinutes;
          best = { route: p, cost: cost };
        }
      }

      return best;
    }

    // 採点と答え合わせの実行
    function updateScoreAndAnswer() {
      if (orders.length === 0) {
        document.getElementById('score-container').style.display = 'none';
        document.getElementById('optimal-box').style.display = 'none';
        return;
      }

      // 1. 満点（正解）の算出
      const optimalResult = findOptimalRoute([...orders]);
      bestOrderList = optimalResult.route;
      const optCost = optimalResult.cost;

      // 2. ユーザーの現在ルートのコスト
      const userCost = evaluateRouteCost(orders);

      // スコア判定（満点の所要時間との差で算出）
      const timeDiff = userCost.totalMinutes - optCost.totalMinutes;
      let userScore = 100 - (timeDiff * 6); // 1分オーバーするごとに-6点
      userScore = Math.max(20, Math.min(100, Math.round(userScore)));

      // 画面更新
      document.getElementById('score-container').style.display = 'grid';
      document.getElementById('optimal-box').style.display = 'block';

      document.getElementById('user-score').innerText = `${userScore} 点`;
      document.getElementById('user-time').innerText = `予想: ${userCost.totalMinutes} 分 (${userCost.totalKm.toFixed(1)}km)`;
      document.getElementById('opt-time').innerText = `最速: ${optCost.totalMinutes} 分 (${optCost.totalKm.toFixed(1)}km)`;

      // 正解ルートテキスト
      const optNames = bestOrderList.map((o, idx) => `[${idx + 1}] ${o.name.replace(/神奈川県|川崎市中原区/g, '')}`);
      document.getElementById('optimal-flow-text').innerText = '店舗 ➔ ' + optNames.join(' ➔ ') + ' ➔ 店舗帰着';
    }

    // ワンタップで正解順序を適用
    function applyOptimalRoute() {
      if (bestOrderList.length === 0) return;
      orders = [...bestOrderList];
      renderList();
    }

    function renderList() {
      const container = document.getElementById('order-list');
      document.getElementById('order-count').innerText = `${orders.length}件`;

      if (orders.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 0.82rem; padding: 20px;">住所を入力してください。</div>';
        document.getElementById('gmaps-box').style.display = 'none';
        updateScoreAndAnswer();
        return;
      }

      let html = '';
      orders.forEach((o, idx) => {
        let zoneClass = 'zone-north';
        if (o.zone.includes('SOUTH')) zoneClass = 'zone-south';
        if (o.zone === 'WEST') zoneClass = 'zone-west';

        html += `
          <div class="order-item" data-id="${o.id}">
            <div class="drag-handle">☰</div>
            <div class="order-num">${idx + 1}</div>
            <div class="order-info">
              <div class="order-name">${o.name}</div>
              <span class="order-zone ${zoneClass}">${o.label}</span>
            </div>
            <button class="btn-delete" onclick="deleteOrder(${idx})">✕</button>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById('gmaps-box').style.display = 'block';

      updateGmapsUrl();
      updateScoreAndAnswer();

      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(container, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: function () {
          const newIds = Array.from(container.children).map(el => el.getAttribute('data-id'));
          orders = newIds.map(id => orders.find(o => o.id === id));
          renderList();
        }
      });
    }

    function updateGmapsUrl() {
      const origin = encodeURIComponent("神奈川県川崎市中原区新丸子東2-906-14");
      const waypoints = orders.map(o => encodeURIComponent(o.name.includes('川崎') ? o.name : `神奈川県川崎市中原区 ${o.name}`)).join('|');
      const url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${origin}&waypoints=${waypoints}&travelmode=driving`;
      document.getElementById('btn-gmaps').href = url;
    }

    function deleteOrder(index) {
      orders.splice(index, 1);
      renderList();
    }

    function clearOrders() {
      if (confirm('全件削除しますか？')) {
        orders = [];
        renderList();
      }
    }
  </script>
</body>
</html>
