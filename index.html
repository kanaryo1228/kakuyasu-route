<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>カクヤス武蔵小杉 配達オーガナイザー</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 12px; max-width: 600px; margin: 0 auto; }
    
    header { background: #1e293b; color: #fff; padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .depot-badge { font-size: 0.75rem; background: #2563eb; color: #fff; padding: 3px 8px; border-radius: 999px; font-weight: bold; }

    .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
    h2 { font-size: 0.88rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    
    .textarea-addr { width: 100%; background: #0f172a; color: #f8fafc; border: 1.5px solid #334155; border-radius: 8px; padding: 10px; font-size: 0.88rem; font-family: inherit; resize: vertical; min-height: 90px; margin-top: 4px; }
    .textarea-addr:focus { outline: none; border-color: #38bdf8; }

    .btn-add { width: 100%; background: #334155; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.88rem; cursor: pointer; margin-top: 6px; }
    
    .sort-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .btn-sort { color: #fff; border: none; padding: 12px 6px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; cursor: pointer; text-align: center; }
    .btn-cw { background: #10b981; box-shadow: 0 3px 8px rgba(16,185,129,0.3); }
    .btn-ccw { background: #0284c7; box-shadow: 0 3px 8px rgba(2,132,199,0.3); }
    .btn-sort:active { filter: brightness(0.85); }

    .order-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .order-item.sortable-ghost { opacity: 0.3; background: #334155; }
    
    .drag-handle { cursor: grab; padding: 6px 10px; color: #64748b; font-size: 1.3rem; user-select: none; }
    .order-num { width: 28px; height: 28px; border-radius: 50%; background: #2563eb; color: #fff; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 8px; }
    .order-info { flex: 1; overflow: hidden; }
    .order-name { font-size: 0.88rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f8fafc; }
    .order-detail { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; }

    .btn-nav-single { background: #059669; color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: bold; flex-shrink: 0; }
    .btn-delete { background: none; border: none; color: #ef4444; font-size: 0.85rem; cursor: pointer; padding: 4px 6px; margin-left: 6px; }
    
    .btn-all-gmaps { display: block; text-align: center; background: #2563eb; color: #fff; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 12px rgba(37,99,235,0.3); margin-top: 12px; }
    .btn-all-gmaps:active { background: #1d4ed8; }

    .route-preview { font-size: 0.78rem; color: #38bdf8; background: #0f172a; padding: 8px 12px; border-radius: 6px; margin-top: 8px; border: 1px solid #334155; line-height: 1.5; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-weight: bold; font-size: 0.95rem;">カクヤス武蔵小杉店</div>
      <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 2px;">新丸子東2-906-14 発着</div>
    </div>
    <span class="depot-badge">一筆書きエリア巡回</span>
  </header>

  <div class="card">
    <h2>
      <span>📝 配達先の入力</span>
      <span id="order-count" style="font-size: 0.75rem; color: #38bdf8;">登録: 0件</span>
    </h2>

    <textarea id="address-input" class="textarea-addr" placeholder="住所を改行で複数貼り付け可能"></textarea>
    <button class="btn-add" onclick="addAddressesFromText()">住所をリストに追加 ＋</button>
  </div>

  <div class="sort-actions">
    <button class="btn-sort btn-cw" onclick="sortByAngle(false)">
      🔄 時計回りで一筆書き<br><span style="font-size:0.7rem; font-weight:normal;">北(丸子) ➔ 南(平間・元住吉)</span>
    </button>
    <button class="btn-sort btn-ccw" onclick="sortByAngle(true)">
      🔄 反時計回りで一筆書き<br><span style="font-size:0.7rem; font-weight:normal;">南(平間・元住吉) ➔ 北(丸子)</span>
    </button>
  </div>

  <div class="card">
    <h2>
      <span>📍 配達順リスト (☰を掴んで指で上下入替可能)</span>
      <button class="btn-delete" onclick="clearAllOrders()">全件削除</button>
    </h2>
    <div id="route-summary" class="route-preview" style="display: none;"></div>
    <div id="order-list" style="margin-top: 8px;">
      <div style="text-align: center; color: #64748b; font-size: 0.82rem; padding: 20px;">
        住所を登録してください。
      </div>
    </div>
  </div>

  <div id="all-gmaps-container" style="display: none; margin-bottom: 24px;">
    <a id="btn-all-gmaps" class="btn-all-gmaps" href="#" target="_blank">
      🗺️ Googleマップで全ルートを開く
    </a>
  </div>

  <script>
    const DEPOT = {
      name: "カクヤス 武蔵小杉店",
      lat: 35.577328,
      lng: 139.662047
    };

    // 中原区主要エリアの基準座標（APIが代表点しか返せなくても即座に正確な方角・位置を特定）
    const LANDMARKS = [
      { key: "上丸子八幡町", lat: 35.5855, lng: 139.6675 },
      { key: "丸子通", lat: 35.5825, lng: 139.6650 },
      { key: "小杉御殿町", lat: 35.5825, lng: 139.6490 },
      { key: "小杉陣屋町", lat: 35.5865, lng: 139.6525 },
      { key: "新丸子東", lat: 35.5775, lng: 139.6635 },
      { key: "小杉町", lat: 35.5750, lng: 139.6560 },
      { key: "今井南町", lat: 35.5700, lng: 139.6520 },
      { key: "木月住吉町", lat: 35.5660, lng: 139.6535 },
      { key: "木月", lat: 35.5630, lng: 139.6500 },
      { key: "西加瀬", lat: 35.5615, lng: 139.6590 },
      { key: "苅宿", lat: 35.5605, lng: 139.6535 },
      { key: "下沼部", lat: 35.5680, lng: 139.6700 },
      { key: "市ノ坪", lat: 35.5665, lng: 139.6570 },
      { key: "田尻町", lat: 35.5585, lng: 139.6770 },
      { key: "北谷町", lat: 35.5620, lng: 139.6730 },
      { key: "上平間", lat: 35.5600, lng: 139.6710 }
    ];

    let orders = [];
    let sortableInstance = null;

    async function addAddressesFromText() {
      const text = document.getElementById('address-input').value;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return alert('住所を入力してください');

      for (const line of lines) {
        let lat = null, lng = null;

        // 1. ローカル辞書判定（ミリ秒で正確なブロックを特定）
        const hit = LANDMARKS.find(lm => line.includes(lm.key));
        if (hit) {
          lat = hit.lat;
          lng = hit.lng;
        } else {
          // 2. 国土地理院フォールバック
          try {
            const query = line.includes('川崎') ? line : `神奈川県川崎市中原区 ${line}`;
            const res = await fetch(`https://msearch.gsi.go.jp/msearch/api/msearch/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data && data.length > 0) {
              lng = data[0].geometry.coordinates[0];
              lat = data[0].geometry.coordinates[1];
            }
          } catch (e) {}
        }

        orders.push({
          id: String(Date.now() + Math.random()),
          name: line,
          lat: lat,
          lng: lng
        });
      }

      document.getElementById('address-input').value = '';
      renderOrders();
      // 追加直後に自動で時計回りソート
      sortByAngle(false);
    }

    // カクヤス店舗を中心とした極座標（方位角）スイープソート（一筆書き保証）
    function sortByAngle(counterClockwise = false) {
      const valid = orders.filter(o => o.lat && o.lng);
      const invalid = orders.filter(o => !o.lat || !o.lng);

      if (valid.length < 2) return;

      valid.forEach(o => {
        // 店舗からの相対ベクトル
        const dy = o.lat - DEPOT.lat;
        const dx = (o.lng - DEPOT.lng) * Math.cos(DEPOT.lat * Math.PI / 180);
        
        // 角度（ラジアン: -PI 〜 PI）
        let angle = Math.atan2(dx, dy); // 北が0、時計回りがプラス
        if (angle < 0) angle += 2 * Math.PI;

        o.angle = angle;
        o.dist = Math.hypot(dx, dy);
      });

      // 角度順に並び替え
      valid.sort((a, b) => {
        return counterClockwise ? (b.angle - a.angle) : (a.angle - b.angle);
      });

      orders = [...valid, ...invalid];
      renderOrders();
    }

    function renderOrders() {
      const container = document.getElementById('order-list');
      document.getElementById('order-count').innerText = `登録: ${orders.length}件`;

      if (orders.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 0.82rem; padding: 20px;">住所を登録してください。</div>';
        document.getElementById('all-gmaps-container').style.display = 'none';
        document.getElementById('route-summary').style.display = 'none';
        return;
      }

      let html = '';
      orders.forEach((o, index) => {
        const dest = encodeURIComponent(o.name.includes('川崎') ? o.name : `川崎市中原区 ${o.name}`);
        const singleGmapUrl = `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`;

        html += `
          <div class="order-item" data-id="${o.id}">
            <div class="drag-handle">☰</div>
            <div class="order-num">${index + 1}</div>
            <div class="order-info">
              <div class="order-name">${o.name}</div>
              <div class="order-detail">${o.lat ? '📍 エリア特定済' : '⚠️ 住所検索'}</div>
            </div>
            <a href="${singleGmapUrl}" target="_blank" class="btn-nav-single">🚗 ナビ</a>
            <button class="btn-delete" onclick="deleteOrder(${index})">✕</button>
          </div>
        `;
      });

      container.innerHTML = html;

      // ルート巡回プレビュー表示
      const summary = document.getElementById('route-summary');
      const routeFlow = ['カクヤス武蔵小杉', ...orders.map(o => o.name.replace(/川崎市中原区/, '')), 'カクヤス武蔵小杉'];
      summary.innerHTML = `🏁 巡回順: <b>${routeFlow.join(' ➔ ')}</b>`;
      summary.style.display = 'block';

      updateAllGmapsLink();

      // 指での手動ドラッグ並び替え
      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(container, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: function () {
          const newIds = Array.from(container.children).map(el => el.getAttribute('data-id'));
          orders = newIds.map(id => orders.find(o => o.id === id));
          renderOrders();
        }
      });
    }

    function updateAllGmapsLink() {
      if (orders.length === 0) {
        document.getElementById('all-gmaps-container').style.display = 'none';
        return;
      }

      const origin = encodeURIComponent("神奈川県川崎市中原区新丸子東2-906-14");
      const destination = origin;

      // 経由地はGoogleマップが確実に認識する正確な住所表記で渡す
      const waypoints = orders.map(o => {
        const full = o.name.includes('川崎') ? o.name : `神奈川県川崎市中原区 ${o.name}`;
        return encodeURIComponent(full);
      }).join('|');

      const allUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=driving`;

      const btn = document.getElementById('btn-all-gmaps');
      btn.href = allUrl;
      document.getElementById('all-gmaps-container').style.display = 'block';
    }

    function deleteOrder(index) {
      orders.splice(index, 1);
      renderOrders();
    }

    function clearAllOrders() {
      if (orders.length === 0) return;
      if (confirm('全件削除しますか？')) {
        orders = [];
        renderOrders();
      }
    }
  </script>
</body>
</html>
